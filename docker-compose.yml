version: "3.9"

services:
  safeframe:
    build: .
    container_name: safeframe-moderation
    ports:
      - "5000:5000"
    volumes:
      - ./static/uploads:/app/static/uploads   # persists uploaded images
      - ./logs:/app/logs                        # persists moderation log
    environment:
      - SECRET_KEY=change-me-in-production
    restart: unless-stopped
